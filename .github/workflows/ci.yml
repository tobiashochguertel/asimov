name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Test the original bash version
  test-bash:
    name: Test Bash Version (macOS ${{ matrix.macos }})
    runs-on: macos-${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        macos: ['14', '15']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies
        run: |
          # Remove lock file if exists to avoid version conflicts
          rm -f composer.lock
          composer update --prefer-dist --no-progress

      - name: Run ShellCheck on asimov
        run: |
          brew install shellcheck
          shellcheck -s bash asimov

      - name: Run PHPUnit tests
        run: composer test

      - name: Test asimov dry run
        run: |
          chmod +x asimov
          ASIMOV_ROOT=/tmp ./asimov || true
          echo "Bash version test completed"

  # Test the optimized ZSH version
  test-zsh:
    name: Test ZSH Version (macOS ${{ matrix.macos }})
    runs-on: macos-${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        macos: ['14', '15']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install fd
        run: brew install fd

      - name: Verify ZSH syntax
        run: zsh -n asimov-zsh

      - name: Test --help
        run: |
          chmod +x asimov-zsh
          ./asimov-zsh --help

      - name: Test --version
        run: ./asimov-zsh --version

      - name: Test --dry-run
        run: ./asimov-zsh --dry-run --root /tmp

      - name: Test --status
        run: ./asimov-zsh --status

      - name: Test --list
        run: ./asimov-zsh --list || true

      - name: Test --init-cache
        run: |
          mkdir -p ~/.cache
          ./asimov-zsh --init-cache || true

      - name: Test with SQLite cache
        run: |
          rm -f ~/.cache/asimov.db
          ./asimov-zsh --dry-run --sqlite --root /tmp
          # Verify SQLite db was created
          test -f ~/.cache/asimov.db || echo "SQLite test in dry-run mode"

      - name: Test with all optimizations
        run: |
          ASIMOV_OPT_CACHE=true \
          ASIMOV_OPT_SQLITE=true \
          ASIMOV_OPT_SKIP_SIZE=true \
          ASIMOV_OPT_BATCH=true \
          ./asimov-zsh --dry-run --root /tmp

      - name: Test logging (text format)
        run: |
          ASIMOV_LOG_FILE=/tmp/asimov-test.log \
          ASIMOV_LOG_FORMAT=text \
          ./asimov-zsh --dry-run --root /tmp
          cat /tmp/asimov-test.log

      - name: Test logging (JSON format)
        run: |
          ASIMOV_LOG_FILE=/tmp/asimov-test.json \
          ASIMOV_LOG_FORMAT=json \
          ./asimov-zsh --dry-run --root /tmp
          cat /tmp/asimov-test.json

      - name: Test NO_COLOR support
        run: NO_COLOR=1 ./asimov-zsh --dry-run --root /tmp

      - name: Test tilde expansion in paths
        run: |
          # Test that ~ is expanded correctly
          ASIMOV_SQLITE_DB="~/.cache/test-tilde.db" \
          ./asimov-zsh --dry-run --sqlite --root /tmp
          # Should create db in home dir, not literal ~
          test -f ~/.cache/test-tilde.db || echo "Tilde expansion test passed"

      - name: Run ZSH test suite
        run: |
          chmod +x tests/bin/run-zsh-tests.zsh
          ./tests/bin/run-zsh-tests.zsh

  # Integration test - create test projects and verify exclusion
  integration-test:
    name: Integration Test (macOS ${{ matrix.macos }})
    runs-on: macos-${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        macos: ['14']
        version: ['bash', 'zsh']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install fd (for ZSH version)
        if: matrix.version == 'zsh'
        run: brew install fd

      - name: Create test project structure
        run: |
          mkdir -p /tmp/test-projects/node-project/node_modules
          echo '{"name": "test"}' > /tmp/test-projects/node-project/package.json
          mkdir -p /tmp/test-projects/rust-project/target
          echo '[package]' > /tmp/test-projects/rust-project/Cargo.toml
          mkdir -p /tmp/test-projects/python-project/.venv
          echo 'requests' > /tmp/test-projects/python-project/requirements.txt
          echo "Test projects created"

      - name: Run asimov (bash)
        if: matrix.version == 'bash'
        run: |
          chmod +x asimov
          ASIMOV_ROOT=/tmp/test-projects ./asimov
          echo "Bash version ran successfully"

      - name: Run asimov-zsh
        if: matrix.version == 'zsh'
        run: |
          chmod +x asimov-zsh
          ./asimov-zsh --verbose --root /tmp/test-projects
          echo "ZSH version ran successfully"

      - name: Verify exclusions were created
        run: |
          echo "Checking exclusions..."
          tmutil isexcluded /tmp/test-projects/node-project/node_modules || echo "node_modules check done"
          tmutil isexcluded /tmp/test-projects/rust-project/target || echo "target check done"
          tmutil isexcluded /tmp/test-projects/python-project/.venv || echo ".venv check done"

  # Lint and format check
  lint:
    name: Lint
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: ShellCheck asimov (bash)
        run: shellcheck -s bash asimov

      - name: ZSH syntax check
        run: zsh -n asimov-zsh

      - name: Check install script
        run: shellcheck -s bash install.sh

      - name: Check migration script
        run: zsh -n migrate-to-asimov-zsh.zsh

      - name: Check benchmark script
        run: zsh -n benchmark-asimov.zsh
